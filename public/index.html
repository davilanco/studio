<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio</title>
<style>
:root{--bg:#14121c;--panel:#1f1c2c;--text:#ece9f7;--mute:#8a85a3;--accent:#ff4f8b;--off:#2d2940}
*{box-sizing:border-box}
body{margin:auto;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:16px;max-width:900px}
h1{font-size:22px;margin:0 0 12px}
.panel{background:var(--panel);border-radius:12px;padding:14px;margin-bottom:14px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:15px;cursor:pointer}
button.sec{background:var(--off)}
label{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center}
.scroll{overflow-x:auto}
.row{display:flex;align-items:center;gap:6px;margin-bottom:6px;min-width:560px}
.name{width:56px;font-size:13px;color:var(--mute)}
.step{flex:1;height:34px;border-radius:6px;background:var(--off);border:0;padding:0}
.step.g{background:#38334f}
.step.on{background:var(--accent)}
.step.cur{outline:2px solid #fff}
.keys{display:flex;height:120px}
.key{flex:1;background:#eee;border:1px solid #999;border-radius:0 0 6px 6px;color:#333;font-size:11px;display:flex;align-items:flex-end;justify-content:center;padding:4px 0;user-select:none;touch-action:none}
.key.b{background:#222;color:#bbb;height:70%;margin:0 -12px;width:24px;flex:none;z-index:1;border-radius:0 0 4px 4px}
.key.down{background:var(--accent);color:#fff}
</style>
</head>
<body>
<h1>🎛 Studio</h1>

<div class="panel bar">
  <button id="play">▶ Play</button>
  <button id="clear" class="sec">Clear</button>
  <label>BPM <input id="bpm" type="range" min=60 max=180 value=110><span id="bpmv">110</span></label>
  <label>Volume <input id="vol" type="range" min=0 max=100 value=70></label>
</div>

<div class="panel scroll"><div id="grid"></div></div>

<div class="panel">
  <div class="bar" style="margin-bottom:10px">
    <label>Synth wave
      <select id="wave"><option>sawtooth</option><option>square</option><option>triangle</option><option>sine</option></select>
    </label>
    <label>Octave <input id="oct" type="range" min=2 max=6 value=4></label>
    <span style="font-size:12px;color:var(--mute)">Tap keys or use A W S E D F T G Y H U J K</span>
  </div>
  <div class="keys" id="keys"></div>
</div>

<script>
let ctx, master;
const $ = id => document.getElementById(id);
function init() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain();
  master.gain.value = $('vol').value / 100;
  master.connect(ctx.destination);
}
$('vol').oninput = e => { if (master) master.gain.value = e.target.value / 100; };

function noiseBuf() {
  const b = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function noise(t, dur, freq, type, gain) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf();
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = ctx.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur);
}
const drums = {
  Kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
    g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.4);
  },
  Snare(t) {
    noise(t, 0.18, 1800, 'highpass', 0.7);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 190; g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.12);
  },
  Hat(t) { noise(t, 0.05, 7000, 'highpass', 0.4); },
  Clap(t) { noise(t, 0.05, 1200, 'bandpass', 0.8); noise(t + 0.015, 0.05, 1200, 'bandpass', 0.8); noise(t + 0.03, 0.15, 1200, 'bandpass', 0.8); }
};
const names = Object.keys(drums), STEPS = 16;
const pattern = { Kick: [0,4,8,12], Snare: [4,12], Hat: [0,2,4,6,8,10,12,14], Clap: [] };
const state = {};
names.forEach(n => state[n] = Array.from({length: STEPS}, (_, i) => pattern[n].includes(i)));

const grid = $('grid');
names.forEach(n => {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<div class="name">${n}</div>`;
  for (let i = 0; i < STEPS; i++) {
    const b = document.createElement('button');
    b.className = 'step' + (Math.floor(i / 4) % 2 ? ' g' : '') + (state[n][i] ? ' on' : '');
    b.dataset.i = i;
    b.onclick = () => { state[n][i] = !state[n][i]; b.classList.toggle('on'); };
    row.appendChild(b);
  }
  grid.appendChild(row);
});
$('clear').onclick = () => { names.forEach(n => state[n].fill(false)); document.querySelectorAll('.step').forEach(b => b.classList.remove('on')); };

let playing = false, step = 0, next = 0, timer;
function highlight(i) {
  document.querySelectorAll('.step').forEach(b => b.classList.toggle('cur', +b.dataset.i === i));
}
function schedule() {
  while (next < ctx.currentTime + 0.12) {
    names.forEach(n => { if (state[n][step]) drums[n](next); });
    const s = step, delay = Math.max(0, (next - ctx.currentTime) * 1000);
    setTimeout(() => playing && highlight(s), delay);
    next += 60 / $('bpm').value / 4;
    step = (step + 1) % STEPS;
  }
}
$('bpm').oninput = e => $('bpmv').textContent = e.target.value;
$('play').onclick = () => {
  init();
  if (ctx.state === 'suspended') ctx.resume();
  playing = !playing;
  $('play').textContent = playing ? '■ Stop' : '▶ Play';
  if (playing) { step = 0; next = ctx.currentTime + 0.05; timer = setInterval(schedule, 25); }
  else { clearInterval(timer); highlight(-1); }
};

const black = [1,3,6,8,10];
const keyMap = 'AWSEDFTGYHUJK';
const keysEl = $('keys');
const keyEls = {};
for (let n = 0; n <= 12; n++) {
  const k = document.createElement('div');
  k.className = 'key' + (black.includes(n % 12) ? ' b' : '');
  k.textContent = keyMap[n];
  const off = () => k.classList.remove('down');
  k.addEventListener('pointerdown', e => { e.preventDefault(); noteOn(n, k); });
  k.addEventListener('pointerup', off);
  k.addEventListener('pointerleave', off);
  keysEl.appendChild(k);
  keyEls[keyMap[n]] = [n, k];
}
function noteOn(n, el) {
  init();
  if (ctx.state === 'suspended') ctx.resume();
  el.classList.add('down');
  const midi = 12 * (+$('oct').value + 1) + n;
  const f = 440 * Math.pow(2, (midi - 69) / 12), t = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = $('wave').value; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
  o.connect(g).connect(master); o.start(t); o.stop(t + 0.75);
}
addEventListener('keydown', e => {
  if (e.repeat || e.target.tagName === 'SELECT') return;
  const m = keyEls[e.key.toUpperCase()];
  if (m) noteOn(m[0], m[1]);
});
addEventListener('keyup', e => { const m = keyEls[e.key.toUpperCase()]; if (m) m[1].classList.remove('down'); });
</script>
</body>
</html>
